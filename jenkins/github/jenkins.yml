name: jenkins

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      git_branch:
        description: GIT_BRANCH no Jenkins
        required: true
        default: main

concurrency:
  group: jenkins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar build no Jenkins
        env:
          GIT_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.git_branch || github.ref_name }}
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_JOB: ${{ vars.JENKINS_JOB_NAME }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_BUILD_TOKEN: ${{ secrets.JENKINS_BUILD_TOKEN }}
        run: |
          set -euo pipefail

          JENKINS_JOB="${JENKINS_JOB:-smartru}"
          BASE="${JENKINS_URL%/}"
          BUILD_URL="${BASE}/job/${JENKINS_JOB}/buildWithParameters"
          AUTH="${JENKINS_USER}:${JENKINS_API_TOKEN}"

          CRUMB_JSON="$(curl -fsS -u "${AUTH}" "${BASE}/crumbIssuer/api/json")"
          CRUMB="$(printf '%s' "${CRUMB_JSON}" | python3 -c "import sys,json; print(json.load(sys.stdin)['crumb'])")"
          CRUMB_FIELD="$(printf '%s' "${CRUMB_JSON}" | python3 -c "import sys,json; print(json.load(sys.stdin)['crumbRequestField'])")"

          curl -fsS -X POST -u "${AUTH}" \
            -H "${CRUMB_FIELD}: ${CRUMB}" \
            -G "${BUILD_URL}" \
            --data-urlencode "token=${JENKINS_BUILD_TOKEN}" \
            --data-urlencode "GIT_BRANCH=${GIT_BRANCH}"

          echo "Build disparado: ${GIT_BRANCH}"
