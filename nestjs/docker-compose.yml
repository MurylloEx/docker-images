services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PORT: ${APP_PORT:-8000}
        APP_UID: ${APP_UID:-1000}
        APP_USER: ${APP_USER:-nestjs}
    ports:
      - "${HOST_PORT:-8000}:${APP_PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      APP_PORT: ${APP_PORT:-8000}
      PORT: ${APP_PORT:-8000}
    volumes:
      - .:/app
      - nestjs_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  nestjs_node_modules:
